name: sample-app

services:
    laravel:
        image: '${SAMPLE_APP_DEVCONTAINER_IMAGE:-ghcr.io/durable-workflow/sample-app-devcontainer:main}'
        pull_policy: '${SAMPLE_APP_DEVCONTAINER_PULL_POLICY:-always}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            SAMPLE_APP_UID: '${SAMPLE_APP_UID:-}'
        ports:
            - '${APP_PORT:-18080}:80'
            - '${VITE_PORT:-15173}:${VITE_PORT:-15173}'
        volumes:
            - '../../:/var/www/html'
        networks:
            - laravel
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
            interval: 5s
            retries: 60
            start_period: 30s
            timeout: 5s
    microservice:
        image: '${SAMPLE_APP_DEVCONTAINER_IMAGE:-ghcr.io/durable-workflow/sample-app-devcontainer:main}'
        pull_policy: '${SAMPLE_APP_DEVCONTAINER_PULL_POLICY:-always}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            SAMPLE_APP_UID: '${SAMPLE_APP_UID:-}'
        ports:
            - '${MICROSERVICE_PORT:-18001}:80'
        volumes:
            - '../../microservice:/var/www/html'
        networks:
            - laravel
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ["php", "artisan", "queue:listen", "shared", "--queue=activity"]
    mysql:
        image: 'mysql:8.0'
        ports:
            - '${FORWARD_DB_PORT:-13306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: '${DB_DATABASE:-sample}'
            MYSQL_USER: '${DB_USERNAME:-laravel}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'laravel-mysql:/var/lib/mysql'
            - './create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - laravel
        healthcheck:
            test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysqladmin ping --host=127.0.0.1 --protocol=TCP --user=$${MYSQL_USER} --silent"]
            interval: 5s
            retries: 30
            start_period: 30s
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-16379}:6379'
        volumes:
            - 'laravel-redis:/data'
        networks:
            - laravel
        healthcheck:
            test: ["CMD-SHELL", "redis-cli --raw ping | grep -Fx PONG"]
            interval: 5s
            retries: 30
            start_period: 5s
            timeout: 5s
networks:
    laravel:
        driver: bridge
volumes:
    laravel-mysql:
        driver: local
    laravel-redis:
        driver: local
