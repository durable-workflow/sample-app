name: sample-app

services:
    laravel:
        image: '${SAMPLE_APP_DEVCONTAINER_IMAGE:-ghcr.io/durable-workflow/sample-app-devcontainer:main}'
        pull_policy: '${SAMPLE_APP_DEVCONTAINER_PULL_POLICY:-always}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            SAMPLE_APP_UID: '${SAMPLE_APP_UID:-}'
        ports:
            - '${APP_PORT:-18080}:80'
            - '${VITE_PORT:-15173}:${VITE_PORT:-15173}'
        volumes:
            - '../../:/var/www/html'
            - 'laravel-vendor:/var/www/html/vendor'
            - '/var/run/docker.sock:/var/run/docker.sock'
        networks:
            - laravel
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
            interval: 5s
            retries: 60
            start_period: 30s
            timeout: 5s
    microservice:
        image: '${SAMPLE_APP_DEVCONTAINER_IMAGE:-ghcr.io/durable-workflow/sample-app-devcontainer:main}'
        pull_policy: '${SAMPLE_APP_DEVCONTAINER_PULL_POLICY:-always}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            SAMPLE_APP_UID: '${SAMPLE_APP_UID:-}'
        working_dir: /var/www/html/microservice
        ports:
            - '${MICROSERVICE_PORT:-18001}:80'
        volumes:
            - '../../:/var/www/html'
            - 'microservice-vendor:/var/www/html/microservice/vendor'
        networks:
            - laravel
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ["php", "artisan", "queue:listen", "shared", "--queue=activity"]
    mysql-seed:
        image: '${SAMPLE_APP_DEVCONTAINER_IMAGE:-ghcr.io/durable-workflow/sample-app-devcontainer:main}'
        pull_policy: '${SAMPLE_APP_DEVCONTAINER_PULL_POLICY:-always}'
        user: root
        entrypoint: ["/usr/local/bin/seed-mysql-volume"]
        volumes:
            - type: volume
              source: laravel-mysql
              target: /var/lib/mysql
              volume:
                  nocopy: true
        restart: 'no'
    mysql:
        image: 'mariadb:11.4'
        command:
            - '--innodb-flush-method=nosync'
            - '--innodb-flush-log-at-trx-commit=0'
            - '--innodb-doublewrite=OFF'
            - '--innodb-file-per-table=OFF'
            - '--innodb-buffer-pool-size=64M'
            - '--innodb-log-file-size=16M'
            - '--performance-schema=OFF'
            - '--skip-name-resolve'
        ports:
            - '${FORWARD_DB_PORT:-13306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: '${DB_DATABASE:-sample}'
            MYSQL_USER: '${DB_USERNAME:-laravel}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - type: volume
              source: laravel-mysql
              target: /var/lib/mysql
              volume:
                  nocopy: true
            - './create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
            - '../schema/mysql-schema.sql:/docker-entrypoint-initdb.d/20-sample-app-schema.sql:ro'
            - './mysql-healthcheck.sh:/usr/local/bin/check-codespaces-mysql-health:ro'
        networks:
            - laravel
        depends_on:
            mysql-seed:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "bash", "/usr/local/bin/check-codespaces-mysql-health"]
            interval: 2s
            retries: 75
            start_period: 30s
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-16379}:6379'
        volumes:
            - 'laravel-redis:/data'
        networks:
            - laravel
        healthcheck:
            test: ["CMD-SHELL", "redis-cli --raw ping | grep -Fx PONG"]
            interval: 5s
            retries: 30
            start_period: 5s
            timeout: 5s
networks:
    laravel:
        driver: bridge
volumes:
    laravel-mysql:
        driver: local
    laravel-redis:
        driver: local
    laravel-vendor:
        driver: local
    microservice-vendor:
        driver: local
