services:
  server:
    environment:
      DW_RUNTIME_CREDENTIALS_ENABLED: "true"
      DW_AUTH_DRIVER: ${CHILD_AUTH_DRIVER:-token}

  smoke:
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - "${CHILD_PROOF_DIR:?set the disposable proof directory}:/proof"
    environment:
      DURABLE_WORKFLOW_SERVER_URL: http://principal-gateway:8083
      CHILD_PROOF_DIR: /proof

  principal-gateway:
    init: true
    user: "${CHILD_UID:?set the invoking UID}:${CHILD_GID:?set the invoking GID}"
    mem_limit: 256m
    cpus: 0.5
    image: ${COMPOSE_PROJECT_NAME}-smoke:latest
    command: ["python", "/app/scripts/principal_gateway.py"]
    volumes:
      - "${CHILD_PROOF_DIR}:/proof"
    environment:
      NAMESPACE_PROOF_DIR: /proof
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8083/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 15

  cancellation-waterline:
    image: durableworkflow/waterline:${DURABLE_WORKFLOW_WATERLINE_VERSION:?resolve the published tuple}
    init: true
    user: "${CHILD_UID}:${CHILD_GID}"
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "127.0.0.1::8080"
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /app/storage/framework/cache/data /app/storage/framework/sessions
        /app/storage/framework/views /app/storage/logs
        && exec /app/entrypoint.sh
    environment:
      WATERLINE_SERVER_ENDPOINT: http://server:8080
      WATERLINE_SERVER_TOKEN: ${CHILD_OBSERVER_TOKEN-test-token}
      WATERLINE_NAMESPACE: default
      WATERLINE_ACCESS_MODE: read_only
      WATERLINE_ALLOW_UNAUTHENTICATED: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/waterline.sqlite
    tmpfs:
      - "/data:uid=${CHILD_UID},gid=${CHILD_GID},mode=0700"
      - "/app/storage:uid=${CHILD_UID},gid=${CHILD_GID},mode=0700"
      - "/app/bootstrap/cache:uid=${CHILD_UID},gid=${CHILD_GID},mode=0700"
