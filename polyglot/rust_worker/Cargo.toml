[package]
name = "durable-workflow-polyglot-rust-worker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
apache-avro = "=0.21.0"
base64 = "=0.22.1"
durable-workflow = "3.4.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }

serde_json = "=1.0.150"
