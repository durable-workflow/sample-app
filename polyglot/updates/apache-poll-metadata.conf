# Only this isolated update recipe enables poll metadata. Keep credentials,
# business payloads, headers and query strings out of these records.
SetEnvIf Request_URI "^/api/worker/workflow-tasks/poll$" sdk_update_poll sdk_update_poll_path=/api/worker/workflow-tasks/poll
SetEnvIf Request_URI "^/api/worker/activity-tasks/poll$" sdk_update_poll sdk_update_poll_path=/api/worker/activity-tasks/poll
SetEnvIf Request_URI "^/api/worker/query-tasks/poll$" sdk_update_poll sdk_update_poll_path=/api/worker/query-tasks/poll
# FallbackResource rewrites the request URI to index.php. Retain only the
# whitelisted path captured before that rewrite, never the raw request line.
LogFormat "{\"scenario\":\"sdk-update-poll-http\",\"started_at_unix_us\":%{begin:usec}t,\"client_ip\":\"%a\",\"method\":\"%<m\",\"path\":\"%{sdk_update_poll_path}e\",\"status\":%>s,\"response_body_bytes\":%B,\"duration_us\":%D,\"connection_state\":\"%X\"}" sdk_update_poll_metadata
# The published virtual host has its own CustomLog, so use GlobalLog to retain
# this opt-in record even though normal access logs exclude idle polls.
GlobalLog ${APACHE_LOG_DIR}/access.log sdk_update_poll_metadata env=sdk_update_poll
