# Only this isolated update recipe enables poll metadata. Keep credentials,
# business payloads, headers and query strings out of these records.
SetEnvIf Request_URI "^/api/worker/(workflow-tasks|activity-tasks|query-tasks)/poll$" sdk_update_poll
LogFormat "{\"scenario\":\"sdk-update-poll-http\",\"started_at_unix_us\":%{begin:usec}t,\"client_ip\":\"%a\",\"method\":\"%m\",\"path\":\"%U\",\"status\":%>s,\"response_body_bytes\":%B,\"duration_us\":%D,\"connection_state\":\"%X\"}" sdk_update_poll_metadata
# The published virtual host has its own CustomLog, so use GlobalLog to retain
# this opt-in record even though normal access logs exclude idle polls.
GlobalLog ${APACHE_LOG_DIR}/access.log sdk_update_poll_metadata env=sdk_update_poll
