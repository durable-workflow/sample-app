name: sample-app-playground

# Native Server 3.x is one process: it creates its schema and the `default`
# namespace at startup and fires timers in-process, so there is no bootstrap
# job, queue worker, scheduler or Redis.
x-server-environment: &server-environment
  DB_CONNECTION: mariadb
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: durable_workflow_playground
  DB_USERNAME: workflow
  DB_PASSWORD: workflow
  DW_WORKER_POLL_TIMEOUT: "3"
  DW_AUTH_DRIVER: token
  DW_AUTH_TOKEN: playground-token

services:
  mysql:
    image: mariadb:11.4
    command:
      - "--innodb-flush-method=nosync"
      - "--innodb-flush-log-at-trx-commit=0"
      - "--innodb-doublewrite=OFF"
      - "--innodb-file-per-table=OFF"
      - "--innodb-buffer-pool-size=64M"
      - "--innodb-log-file-size=16M"
      - "--performance-schema=OFF"
      - "--skip-name-resolve"
    environment:
      MYSQL_DATABASE: durable_workflow_playground
      MYSQL_USER: workflow
      MYSQL_PASSWORD: workflow
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          healthcheck.sh --connect --innodb_initialized &&
          mariadb --protocol=tcp --host=127.0.0.1
          --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}"
          --database="$${MYSQL_DATABASE}" --batch --skip-column-names
          --execute='SELECT 1' >/dev/null
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  server:
    image: ${DURABLE_SERVER_IMAGE:?resolve the published artifact tuple first}
    init: true
    environment: *server-environment
    ports:
      - "${PLAYGROUND_SERVER_PORT:-18082}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # The native image has no curl; bash's /dev/tcp reads /api/ready.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 3s
      timeout: 3s
      retries: 40

  waterline:
    image: ${DURABLE_WORKFLOW_WATERLINE_IMAGE:?resolve the published artifact tuple first}
    environment:
      APP_URL: http://localhost:${PLAYGROUND_WATERLINE_PORT:-18083}
      WATERLINE_SERVER_ENDPOINT: http://server:8080
      WATERLINE_SERVER_TOKEN: playground-token
      WATERLINE_NAMESPACE: default
      WATERLINE_ACCESS_MODE: read_only
      WATERLINE_ALLOW_UNAUTHENTICATED: "true"
    ports:
      - "${PLAYGROUND_WATERLINE_PORT:-18083}:8080"
    volumes:
      - waterline-data:/data
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  waterline-data:
