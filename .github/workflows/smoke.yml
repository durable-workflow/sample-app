name: smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: docker compose sample workflows
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_PROJECT_NAME: sample-app-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      APP_PORT: "0"
      SAMPLE_APP_SMOKE_ONLY: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build and start stack
        run: docker compose up -d --build --wait app worker

      - name: Run deterministic workflow samples
        run: scripts/compose-smoke.sh

      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans

  service-mode:
    name: service-mode onboarding (fresh and repeat)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_PROJECT_NAME: >-
        sample-app-service-${{ github.run_id }}-${{ github.run_attempt }}
      DURABLE_WORKFLOW_ARTIFACT_SOURCE: pinned
      SERVICE_MODE_PORT: "18081"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Export the supported artifact tuple for diagnostics and cleanup
        run: scripts/resolve-current-artifacts.sh >> "$GITHUB_ENV"

      - name: Run the documented service-mode path from a clean project
        env:
          SERVICE_MODE_EVIDENCE_PATH: service-mode-first.json
        run: scripts/service-mode.sh

      - name: Run the documented command again without cleanup
        env:
          SERVICE_MODE_EVIDENCE_PATH: service-mode-repeat.json
        run: scripts/service-mode.sh

      - name: Validate timings, runtime results, versions, and unique identities
        run: >-
          python3 scripts/ci/validate-service-mode-evidence.py
          service-mode-first.json
          service-mode-repeat.json

      - name: Open the matching Waterline route
        run: |
          waterline_url="$(
            python3 -c '
          import json
          data = json.load(open("service-mode-repeat.json"))
          print(data["workflow"]["waterline_url"])
          '
          )"
          curl --fail --silent --show-error --location "$waterline_url" \
            | grep -E 'Waterline|waterline'

      - name: Retain startup and result timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: service-mode-onboarding-evidence
          path: |
            service-mode-*.json
            service-mode-*-waterline.png
            service-mode-*-waterline-dialogs/**
          if-no-files-found: error
          retention-days: 30

      - name: Dump service-mode logs
        if: failure()
        run: >-
          docker compose -f polyglot/service-mode.yml logs
          --no-color --timestamps

      - name: Tear down isolated service-mode state
        if: always()
        run: >-
          docker compose -f polyglot/service-mode.yml down
          -v --remove-orphans
