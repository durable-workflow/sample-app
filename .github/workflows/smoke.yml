name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: docker compose sample workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sample-app-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      APP_PORT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start stack
        run: docker compose up -d --build --wait app worker
      - name: Run embedded workflow samples
        run: scripts/compose-smoke.sh
      - name: Dump logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
