name: polyglot validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: polyglot smoke (PHP/Python/Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POLYGLOT_COMPOSE_PROJECT_NAME: sample-app-polyglot-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test smoke metadata
        run: python3 -m unittest discover -s polyglot/python_worker/tests -v
      - name: Run the documented service-mode example
        run: scripts/polyglot.sh
      - name: Dump logs
        if: failure()
        run: >-
          docker compose --project-directory polyglot
          -f polyglot/docker-compose.yml
          -p "$POLYGLOT_COMPOSE_PROJECT_NAME"
          logs --no-color --timestamps
      - name: Tear down stack
        if: always()
        run: scripts/polyglot.sh down
