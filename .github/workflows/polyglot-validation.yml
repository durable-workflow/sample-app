name: polyglot-validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: polyglot smoke (PHP/Python/Rust, ${{ matrix.cache_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cache_mode: [cold-cache, warm-cache]
    env:
      DURABLE_WORKFLOW_ARTIFACT_SOURCE: current
      POLYGLOT_BUILD_CACHE_MODE: ${{ matrix.cache_mode }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Test polyglot metadata evidence
        run: python3 -m unittest discover -s polyglot/python_worker/tests -v

      - name: Set isolated Compose project
        shell: bash
        run: |
          raw="sample-app-polyglot-${GITHUB_RUN_ID:-local}-${GITHUB_JOB:-smoke}-${POLYGLOT_BUILD_CACHE_MODE}-${GITHUB_RUN_ATTEMPT:-1}"
          project="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_-' '-')"
          project="${project%-}"
          echo "COMPOSE_PROJECT_NAME=$project" >> "$GITHUB_ENV"
          echo "Polyglot Compose project: $project"

      - name: Resolve current artifact tuple
        shell: bash
        run: |
          while IFS= read -r assignment; do
            echo "$assignment" >> "$GITHUB_ENV"
            export "$assignment"
            printf '%s\n' "$assignment"
          done < <(scripts/resolve-current-artifacts.sh)

      - name: Show resolved server image
        working-directory: polyglot
        run: |
          # Surface the durableworkflow/server tag the smoke is about to run
          # against, so a human reviewing the CI log can immediately see which
          # server build the polyglot scenarios were exercised on.
          echo "Polyglot server image:"
          docker compose config server | awk '/^[[:space:]]+image:/ {print; exit}'

      - name: Validate one stable polyglot runtime lifecycle
        shell: bash
        run: timeout --signal=TERM --kill-after=60s 1620s scripts/polyglot-validation.sh
