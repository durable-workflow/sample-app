name: published SDK namespaces

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-namespaces-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  namespaces:
    name: Rust namespaces, principals and spoofing refusal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDK_NAMESPACES_COMPOSE_PROJECT_NAME: sample-app-sdk-namespaces-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the exact published tuple
        run: scripts/resolve-current-artifacts.sh >> "$GITHUB_ENV"
      - name: Run the documented namespace experiment
        run: SDK_NAMESPACES_RESULT_DIR="$RUNNER_TEMP/sdk-namespaces-proof" scripts/sdk-namespaces.sh
      - name: Retain histories, injected requests and physical worker loss
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-namespaces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-namespaces-proof
          if-no-files-found: warn
          retention-days: 30
