name: published SDK children

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-children-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  children:
    name: SDK children (PHP/Python/Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDK_CHILDREN_COMPOSE_PROJECT_NAME: sample-app-sdk-children-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the exact published tuple
        run: scripts/resolve-current-artifacts.sh >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked browser tooling
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run the documented child experiment
        run: SDK_CHILDREN_RESULT_DIR="$RUNNER_TEMP/sdk-children-proof" scripts/sdk-children.sh
      - name: Retain original histories, cancellation actors and request receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-children-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-children-proof
          if-no-files-found: warn
          retention-days: 30
