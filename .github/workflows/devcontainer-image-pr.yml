name: devcontainer image pull request

on:
  pull_request:
    branches: [main]
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-image.yml
      - .github/workflows/devcontainer-image-pr.yml
      - playground/**
      - polyglot/qualified-artifact-tuple.json
      - app/Console/Commands/Init.php
      - composer.json
      - composer.lock
      - docker/**
      - microservice/composer.json
      - microservice/composer.lock
      - package.json
      - package-lock.json
      - scripts/ci/qualify-devcontainer-image.sh
      - scripts/playground
      - scripts/resolve-current-artifacts.sh

permissions:
  contents: read

concurrency:
  group: devcontainer-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate candidate image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build untrusted candidate without a shared cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: .devcontainer/docker/Dockerfile
          platforms: linux/amd64
          load: true
          no-cache: true
          pull: true
          push: false
          tags: sample-app-devcontainer:candidate
          build-args: VCS_REF=${{ github.sha }}
      - name: Qualify Codespaces startup
        env:
          DEVCONTAINER_EXPECTED_REVISION: ${{ github.sha }}
          DEVCONTAINER_REQUIRE_PUBLISHED_ATTESTATIONS: '0'
          DEVCONTAINER_SKIP_IMAGE_PULL: '1'
        run: >-
          scripts/ci/qualify-devcontainer-image.sh
          sample-app-devcontainer:candidate
          linux/amd64
