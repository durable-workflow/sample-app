name: devcontainer image

on:
  pull_request:
    branches: [ main ]
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-image.yml
      - app/Console/Commands/Init.php
      - composer.json
      - composer.lock
      - docker/install-phpredis.sh
      - docker/playwright-smoke.js
      - microservice/composer.json
      - microservice/composer.lock
      - package.json
      - package-lock.json
      - scripts/ci/qualify-devcontainer-image.sh
  push:
    branches: [ main ]
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-image.yml
      - app/Console/Commands/Init.php
      - composer.json
      - composer.lock
      - docker/install-phpredis.sh
      - docker/playwright-smoke.js
      - microservice/composer.json
      - microservice/composer.lock
      - package.json
      - package-lock.json
      - scripts/ci/qualify-devcontainer-image.sh
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'protected-main' }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/durable-workflow/sample-app-devcontainer
  DOCKERHUB_IMAGE: durableworkflow/sample-app-devcontainer
  REVISION_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate:
    name: Validate image (${{ matrix.platform }})
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3

      - name: Build untrusted candidate without shared cache
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6
        with:
          context: .
          file: .devcontainer/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          no-cache: true
          pull: true
          push: false
          tags: sample-app-devcontainer:candidate-${{ matrix.suffix }}
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Qualify candidate topology
        env:
          DEVCONTAINER_EXPECTED_REVISION: ${{ github.sha }}
          DEVCONTAINER_REQUIRE_PUBLISHED_ATTESTATIONS: 0
          DEVCONTAINER_SKIP_IMAGE_PULL: 1
        run: >-
          scripts/ci/qualify-devcontainer-image.sh
          sample-app-devcontainer:candidate-${{ matrix.suffix }}
          ${{ matrix.platform }}
          devcontainer-timing-${{ matrix.suffix }}.json

      - name: Retain candidate timing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: devcontainer-candidate-timing-${{ matrix.suffix }}
          path: devcontainer-timing-${{ matrix.suffix }}.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable multi-platform image
    if: >-
      ${{
        github.server_url == 'https://github.com' &&
        github.repository == 'durable-workflow/sample-app' &&
        github.ref == 'refs/heads/main' &&
        github.event_name != 'pull_request'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3
        with:
          username: durableworkflow
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build once and publish immutable tags
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6
        with:
          context: .
          file: .devcontainer/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          no-cache: true
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.REVISION_TAG }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.REVISION_TAG }}
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Record published index digest
        run: echo "Published multi-platform index ${{ steps.build.outputs.digest }}"

  qualify-published:
    name: Qualify public image (${{ matrix.registry }}, ${{ matrix.platform }})
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr
            image: ghcr.io/durable-workflow/sample-app-devcontainer
            platform: linux/amd64
            suffix: ghcr-amd64
          - registry: ghcr
            image: ghcr.io/durable-workflow/sample-app-devcontainer
            platform: linux/arm64
            suffix: ghcr-arm64
          - registry: dockerhub
            image: durableworkflow/sample-app-devcontainer
            platform: linux/amd64
            suffix: dockerhub-amd64
          - registry: dockerhub
            image: durableworkflow/sample-app-devcontainer
            platform: linux/arm64
            suffix: dockerhub-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3

      - name: Pull and qualify without registry credentials
        env:
          DEVCONTAINER_EXPECTED_REVISION: ${{ github.sha }}
        run: >-
          scripts/ci/qualify-devcontainer-image.sh
          ${{ matrix.image }}:${{ env.REVISION_TAG }}
          ${{ matrix.platform }}
          devcontainer-timing-${{ matrix.suffix }}.json

      - name: Retain public startup timing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: devcontainer-public-timing-${{ matrix.suffix }}
          path: devcontainer-timing-${{ matrix.suffix }}.json
          if-no-files-found: error
          retention-days: 90

  promote-main:
    name: Promote qualified image to main
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [publish, qualify-published]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3
        with:
          username: durableworkflow
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move protected main channels
        run: |
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:main" \
            "${GHCR_IMAGE}:${REVISION_TAG}"
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:main" \
            "${DOCKERHUB_IMAGE}:${REVISION_TAG}"

  verify-main:
    name: Verify public main channel (${{ matrix.registry }})
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [promote-main]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr
            image: ghcr.io/durable-workflow/sample-app-devcontainer
          - registry: dockerhub
            image: durableworkflow/sample-app-devcontainer
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3

      - name: Compare moving and immutable manifests without credentials
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${REVISION_TAG}" --raw > revision.json
          docker buildx imagetools inspect "${IMAGE}:main" --raw > main.json
          cmp revision.json main.json
