version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:17'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-maintenance:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:27'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions-maintenance:
        patterns:
          - '*'
